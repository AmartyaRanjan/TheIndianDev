[project]
name = "advbug"
version = "0.1.0"
description = "Adversarial self-play (injector vs detector, GRPO) for code bug detection: ablation study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libcst>=1.4",
    "numpy>=1.26",
    "datasets>=3.0",
    "datasketch>=1.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "vllm>=0.10",
    "transformers>=4.55",
    "peft>=0.17",
    "accelerate>=1.10",
    "wandb>=0.21",
]
eval = [
    "anthropic>=0.70",
    "google-genai>=2.28",
    "ruff>=0.13",
    "pyflakes>=3.4",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advbug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
